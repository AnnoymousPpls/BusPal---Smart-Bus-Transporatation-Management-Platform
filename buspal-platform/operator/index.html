<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BusPal — Operator Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/css/style.css" />
<script>
  (function(){
    var saved = localStorage.getItem('buspal-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<script src="../shared/js/auth.js"></script>
<script>
  // Guard: only signed-in owner/manager admins may view this page.
  var __session = AuthStore.requireRole(['owner', 'manager'], '../index.html');
</script>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <div class="brand">
        <img src="../shared/assets/logo.png" alt="BusPal" class="brand-mark" />
        <span class="brand-name">BusPal <span class="ops-tag">Ops</span></span>
      </div>
      <button class="side-close" id="sideClose" aria-label="Close menu">✕</button>
    </div>

    <nav class="side-nav" id="sideNav">
      <button class="nav-item active" data-route="overview"><span class="nav-ico">◈</span><span>Overview</span></button>
      <button class="nav-item" data-route="buses"><span class="nav-ico nav-ico-svg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="10" rx="2"/><path d="M3 11h18"/><path d="M7 6v5M17 6v5"/><circle cx="7.5" cy="18" r="1.4"/><circle cx="16.5" cy="18" r="1.4"/></svg></span><span>Buses</span></button>
      <button class="nav-item" data-route="routes"><span class="nav-ico nav-ico-svg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3 5 21"/><path d="M15 3l4 18"/><path d="M12 8v1.5M12 13v1.5M12 18v1.5"/></svg></span><span>Routes &amp; Schedules</span></button>
      <button class="nav-item" data-route="bookings"><span class="nav-ico">▤</span><span>Bookings</span></button>
      <button class="nav-item" data-route="staff"><span class="nav-ico">◐</span><span>Drivers &amp; Conductors</span></button>
      <button class="nav-item" data-route="conductor"><span class="nav-ico">▦</span><span>Conductor View</span></button>
      <button class="nav-item" data-route="tracking"><span class="nav-ico">◎</span><span>Live Tracking</span></button>
      <button class="nav-item" data-route="fuel"><span class="nav-ico nav-ico-svg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14"/><path d="M4 21h10"/><path d="M14 10h2l3 3v5a1 1 0 0 1-1 1h-1"/><circle cx="17.5" cy="17" r="1.3"/><path d="M7 6v3h4V6"/></svg></span><span>Fuel &amp; Maintenance</span></button>
      <button class="nav-item" data-route="feedback"><span class="nav-ico">✆</span><span>Feedback &amp; SOS</span></button>
      <button class="nav-item" data-route="profile"><span class="nav-ico">⚙</span><span>Settings</span></button>
    </nav>

    <div class="side-bottom">
      <button class="nav-item nav-item-muted" id="logoutBtn"><span class="nav-ico">⏻</span><span>Log out</span></button>
    </div>
  </aside>
  <div class="side-backdrop" id="sideBackdrop"></div>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="topbar-title">
        <h1 id="pageTitle">Overview</h1>
      </div>
      <div class="topbar-actions">
        <span class="badge bad sos-live-badge" id="sosLiveBadge" hidden>⚠ SOS active</span>
        <button class="theme-toggle" id="themeToggle" title="Switch theme" aria-label="Switch theme">
          <span class="theme-track-icon left">☾</span>
          <span class="theme-track-icon right">☀</span>
          <span class="theme-knob" id="themeKnob"></span>
        </button>
        <button class="avatar-btn" id="profileShortcut" title="Settings"><span id="avatarInitials">LP</span></button>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>

  <!-- GENERIC FORM MODAL (buses / staff / routes / fuel) -->
  <div class="modal" id="formModal" aria-hidden="true">
    <div class="sheet">
      <header>
        <div class="title" id="formModalTitle">Add item</div>
        <button class="btn ghost" id="formModalClose">Close</button>
      </header>
      <div class="body" id="formModalBody"></div>
    </div>
  </div>

  <!-- CONFIRM DELETE MODAL -->
  <div class="modal" id="confirmModal" aria-hidden="true">
    <div class="sheet sheet-narrow">
      <header>
        <div class="title">Are you sure?</div>
        <button class="btn ghost" id="confirmModalClose">Close</button>
      </header>
      <div class="body" id="confirmModalBody"></div>
    </div>
  </div>

  <!-- FLOATING SOS STATUS (persistent, right side — blooms only while an alert is active) -->
  <button class="sos-fab idle" id="sosFab" aria-label="View SOS alerts">
    <span class="sos-fab-petal p1"></span>
    <span class="sos-fab-petal p2"></span>
    <span class="sos-fab-petal p3"></span>
    <span class="sos-fab-petal p4"></span>
    <span class="sos-fab-petal p5"></span>
    <span class="sos-fab-petal p6"></span>
    <span class="sos-fab-core" id="sosFabCore">SOS</span>
  </button>

  <div class="toast" id="toast" hidden></div>

  <script src="../shared/js/store.js"></script>
  <script src="../shared/js/imageUtils.js"></script>
  <script src="../shared/js/seatLayout.js"></script>
  <script src="../shared/js/validate.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/core.js"></script>
  <script src="./js/overview.js"></script>
  <script src="./js/buses.js"></script>
  <script src="./js/routes.js"></script>
  <script src="./js/staff.js"></script>
  <script src="./js/conductor.js"></script>
  <script src="./js/tracking.js"></script>
  <script src="./js/fuel.js"></script>
  <script src="./js/bookings.js"></script>
  <script src="./js/feedback.js"></script>
  <script src="./js/profile.js"></script>
  <script src="./js/boot.js"></script>
</body>
</html>
