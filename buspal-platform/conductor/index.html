<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BusPal — Conductor Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/css/style.css" />
<script>
  (function(){
    var saved = localStorage.getItem('buspal-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body class="conductor-body">

  <header class="conductor-header">
    <div class="brand">
      <img src="../shared/assets/logo.png" alt="BusPal" class="brand-mark" />
      <span class="brand-name">BusPal <span class="ops-tag">Conductor</span></span>
    </div>
    <button class="theme-toggle" id="themeToggle" title="Switch theme" aria-label="Switch theme">
      <span class="theme-track-icon left">☾</span>
      <span class="theme-track-icon right">☀</span>
      <span class="theme-knob"></span>
    </button>
  </header>

  <main class="conductor-main" id="main">
    <!-- CODE ENTRY -->
    <div class="conductor-gate" id="gate">
      <div class="card card-pad conductor-gate-card">
        <h2 style="margin-bottom:6px">Enter trip access code</h2>
        <p class="muted small" style="margin-bottom:18px">Get this 6-character code from your Owner or Manager for the trip you're conducting. No account or password needed.</p>
        <form id="codeForm" class="form-grid">
          <div class="field-v">
            <input type="text" id="codeInput" placeholder="e.g. K4X9QP" maxlength="6" autocapitalize="characters"
              style="text-align:center;font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:6px;text-transform:uppercase" />
          </div>
          <div class="error" id="codeError" style="color:var(--danger);font-size:13px;text-align:center"></div>
          <button class="btn brand block" type="submit">Open trip</button>
        </form>
      </div>
    </div>

    <!-- TRIP VIEW (shown after a valid code) -->
    <div id="tripView" hidden></div>
  </main>

  <!-- SEAT/COUNTER MODAL -->
  <div class="modal" id="formModal" aria-hidden="true">
    <div class="sheet">
      <header>
        <div class="title" id="formModalTitle">Details</div>
        <button class="btn ghost" id="formModalClose">Close</button>
      </header>
      <div class="body" id="formModalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="../shared/js/store.js"></script>
  <script src="../shared/js/seatLayout.js"></script>
  <script src="../shared/js/validate.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
